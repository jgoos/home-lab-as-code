---
# Quality gate for an infrastructure repo: YAML, HCL and secrets.
# Install once with `pre-commit install`; run over everything with
# `pre-commit run --all-files`.
#
# The terraform, terraform-docs and packer hooks shell out to those binaries,
# so they need them on PATH. They only fire when matching files change.

minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      # The kickstart files carry root password hashes; this is the backstop
      # for the day someone pastes a key into one.
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      # No --strict: that promotes style warnings to failures, and the
      # existing playbooks carry a few. Rules at error level still block.
      - id: yamllint

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        # Upstream hardcodes language_version: python3.14 as a floor, but the
        # package itself only requires >=3.10 and RHEL 10 ships 3.12. Without
        # this override pre-commit fails to build the hook environment at all.
        language_version: python3

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_docs

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: packer-fmt
        name: packer fmt
        description: Canonical formatting for .pkr.hcl templates.
        entry: packer fmt -check -diff
        language: system
        files: \.pkr\.hcl$
        pass_filenames: false
        args: [packer/]
