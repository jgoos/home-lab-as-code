name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint_validate_test:
    name: Lint, Validate and Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Install uv package manager
        run: pip install --upgrade uv

      - name: Upgrade pip and setuptools
        run: pip install --upgrade pip setuptools

      - name: Install Python dependencies
        run: uv pip install --system -r pyproject.toml

      - name: Install Ansible collections
        if: ${{ hashFiles('ansible/collections/requirements.yml') != '' }}
        run: ansible-galaxy collection install -r ansible/collections/requirements.yml --force

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up Packer
        uses: hashicorp/setup-packer@v2

      - name: Ruff lint
        run: ruff check .

      - name: Black formatting check
        run: black --check .

      - name: Bandit security scan
        run: bandit -r .

      - name: Dependency vulnerability scan
        run: pip-audit

      - name: Mypy type checking
        run: |
          if find . -name '*.py' -not -path './.venv/*' | grep -q .; then
            mypy .
          else
            echo "No Python files to type check"
          fi

      - name: Pylint
        run: |
          if find . -name '*.py' -not -path './.venv/*' | grep -q .; then
            pylint **/*.py
          else
            echo "No Python files to lint with pylint"
          fi

      - name: YAML lint
        run: yamllint .

      - name: Terraform format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Packer format check
        run: packer fmt -check ./packer

      - name: Packer validate
        run: |
          for file in packer/*.pkr.hcl; do
            packer validate "$file"
          done

      - name: Ansible syntax check
        run: |
          for playbook in ansible/*.yml; do
            ansible-playbook --syntax-check "$playbook"
          done

      - name: Run tests
        if: ${{ hashFiles('tests/**') != '' }}
        run: pytest -q
